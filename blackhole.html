<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole with Stars</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      // Set theme based on system-wide dark mode preference (before page renders to avoid flash)
      (function () {
        var darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        var applyTheme = function () {
          document.documentElement.setAttribute('data-bs-theme', darkModeQuery.matches ? 'dark' : 'light');
        };
        applyTheme();
        // Live-update if the system theme changes while the page is open
        darkModeQuery.addEventListener('change', applyTheme);
      })();
    </script>
</head>
<body class="blackhole-page">
    <div class="black-hole"></div>
    <script src="{{ '/assets/js/blackhole.js' | relative_url }}"></script>
</body>
</html>
